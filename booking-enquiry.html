      const lenis = new Lenis({
        duration: 1.2,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),

<script>
  const phoneInputField = document.querySelector("#phone");
  const form = document.querySelector("#registerForm");

  const iti = window.intlTelInput(phoneInputField, {
    initialCountry: "ae",
    preferredCountries: ["ae", "in", "us", "gb"],
    utilsScript:
      "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
  });

  const PABBLY_WEBHOOK_URL = 'https://connect.pabbly.com/webhook-listener/webhook/IjU3NjMwNTZmMDYzNTA0MzQ1MjZiNTUzMCI_3D_pc/IjU3NjcwNTY4MDYzZjA0MzU1MjZmNTUzNTUxMzMi_pc';

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!iti.isValidNumber()) {
      alert("Please enter a valid phone number.");
      phoneInputField.focus();
      return;
    }

    const submitButton = form.querySelector("button[type='submit']");
    const submitLabel = submitButton.querySelector("label");

    submitButton.disabled = true;
    submitLabel.textContent = "Submitting...";

    try {
      const formData = new FormData(form);
      // Send the full international phone number (including country code).
      formData.set("Phone", iti.getNumber());

      const response = await fetch(PABBLY_WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      const responseText = await response.text();
      console.log("Pabbly HTTP status:", response.status);
      console.log("Pabbly response:", responseText);

      // A 2xx response means the webhook endpoint accepted the HTTP request.
      // Do not require a particular JSON field such as result.success.
      if (!response.ok) {
        throw new Error(
          `Pabbly webhook returned HTTP ${response.status}: ${responseText}`
        );
      }

      // Pabbly may respond with JSON or plain text (for example, "Webhook received").
      // Redirect on HTTP success rather than incorrectly treating its response text
      // as an application-level failure.
      window.location.href = "/thank-you.html";
    } catch (error) {
      console.error("Pabbly webhook submission error:", error);
      alert(
        "We couldn't confirm your enquiry was submitted. Please try again."
      );
      submitButton.disabled = false;
      submitLabel.textContent = "Register";
    }
  });
</script>
